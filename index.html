<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofia Shane Tomarompong | Executive Assistant & Virtual Assistant</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            molang: {
              bg: 'var(--bg-main)',
              card: 'var(--bg-card)',
              accent: 'var(--bg-accent)',
              soft: 'var(--bg-soft)',
              mid: '#FFB3C6',
              rose: '#FF8FAB',
              deep: '#E06D88',
              text: 'var(--text-main)',
              subtext: 'var(--text-sub)',
              border: 'var(--border-color)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            cute: ['Quicksand', 'sans-serif']
          },
          boxShadow: {
            'molang': '0 10px 30px -5px var(--shadow-color)',
            'molang-hover': '0 16px 35px -5px var(--shadow-hover-color)',
            'glow': '0 0 20px rgba(255, 143, 171, 0.45)'
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-main: #FFF0F5;
      --bg-card: #FFFFFF;
      --bg-accent: #FFE5EC;
      --bg-soft: #FFC2D1;
      --text-main: #4A3E4E;
      --text-sub: #725B6E;
      --border-color: #FFE5EC;
      --shadow-color: rgba(255, 179, 198, 0.3);
      --shadow-hover-color: rgba(255, 143, 171, 0.45);
    }

    .dark {
      --bg-main: #1D1826;
      --bg-card: #282135;
      --bg-accent: #372A47;
      --bg-soft: #523D68;
      --text-main: #F4EBF1;
      --text-sub: #C8B9C7;
      --border-color: #3F3052;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --shadow-hover-color: rgba(255, 143, 171, 0.25);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-cute {
      font-family: 'Quicksand', sans-serif;
    }

    /* Floating Animation */
    @keyframes molangFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .animate-molang-float {
      animation: molangFloat 4s ease-in-out infinite;
    }

    /* Heart Particle Burst */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      animation: floatUpAndFade 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 9999;
    }

    @keyframes floatUpAndFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(0deg); }
      50% { opacity: 0.9; transform: translate(-50%, -100px) scale(1.2) rotate(15deg); }
      100% { opacity: 0; transform: translate(-50%, -160px) scale(0.8) rotate(-15deg); }
    }

    /* Card 3D Tilt Effect Container */
    .tilt-card {
      transition: transform 0.2s ease-out, box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }

    /* Modal Backdrop Blur */
    .modal-backdrop {
      background: rgba(29, 24, 38, 0.5);
      backdrop-filter: blur(8px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #FFC2D1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FF8FAB;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between selection:bg-molang-soft selection:text-molang-text">

  <header class="sticky top-0 z-40 bg-molang-card/85 backdrop-blur-md border-b border-molang-border transition-colors duration-400">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo / Identity -->
      <a href="#hero" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-2xl bg-molang-accent flex items-center justify-center overflow-hidden border border-molang-soft group-hover:scale-105 transition-all">
          <img src="07E03E68-3256-4A01-9FB6-72AAA629338A.jpeg" alt="Logo" class="w-full h-full object-cover">
        </div>
        <div>
          <span class="font-cute font-bold text-lg text-molang-text tracking-tight group-hover:text-molang-rose transition-colors">
            Sofia Shane <span class="text-molang-rose">.</span>
          </span>
          <p class="text-[10px] text-molang-subtext font-medium leading-none hidden sm:block">Executive & Virtual Assistant</p>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-1 text-sm font-medium text-molang-subtext">
        <a href="#about" class="px-3 py-1.5 rounded-full hover:text-molang-rose hover:bg-molang-accent/60 transition-all">About</a>
        <a href="#experience" class="px-3 py-1.5 rounded-full hover:text-molang-rose hover:bg-molang-accent/60 transition-all">Experience</a>
        <a href="#tools-skills" class="px-3 py-1.5 rounded-full hover:text-molang-rose hover:bg-molang-accent/60 transition-all">Tools & Skills</a>
        <a href="#education" class="px-3 py-1.5 rounded-full hover:text-molang-rose hover:bg-molang-accent/60 transition-all">Education</a>
        <a href="#contact" class="px-3 py-1.5 rounded-full hover:text-molang-rose hover:bg-molang-accent/60 transition-all">Contact</a>
      </nav>

      <!-- Right Action Group (Theme Toggle + Hire Button) -->
      <div class="flex items-center gap-3">
        <!-- Theme Mode Toggle -->
        <button id="theme-toggle" onclick="toggleDarkMode()" class="w-10 h-10 rounded-2xl bg-molang-accent border border-molang-soft flex items-center justify-center text-molang-text hover:text-molang-rose transition-all shadow-sm focus:outline-none" aria-label="Toggle Theme">
          <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
        </button>

        <a href="#contact" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-molang-rose text-white text-xs font-semibold hover:bg-molang-deep transition-all shadow-sm hover:shadow-md active:scale-95">
          <span>Hire Sofia</span>
          <i class="fa-solid fa-sparkles text-[10px]"></i>
        </a>

        <!-- Mobile Menu Hamburger -->
        <button id="mobile-menu-btn" class="md:hidden p-2.5 rounded-2xl bg-molang-accent text-molang-text hover:bg-molang-soft focus:outline-none transition-all">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Drawer Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-molang-card border-b border-molang-border px-4 py-4 space-y-2 text-sm font-medium shadow-lg transition-all">
      <a href="#about" class="block px-4 py-2.5 rounded-2xl hover:bg-molang-accent text-molang-text">About Sofia</a>
      <a href="#experience" class="block px-4 py-2.5 rounded-2xl hover:bg-molang-accent text-molang-text">Experience Timeline</a>
      <a href="#tools-skills" class="block px-4 py-2.5 rounded-2xl hover:bg-molang-accent text-molang-text">Tools Showcase & Skills</a>
      <a href="#education" class="block px-4 py-2.5 rounded-2xl hover:bg-molang-accent text-molang-text">Education & Reference</a>
      <a href="#contact" class="block px-4 py-2.5 rounded-2xl bg-molang-rose text-white text-center font-bold">Contact & Hire</a>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-20 space-y-20">

    <section id="hero" class="pt-4 md:pt-10 scroll-mt-24">
      <div class="tilt-card bg-molang-card rounded-[32px] p-6 sm:p-10 shadow-molang border border-molang-border relative overflow-hidden flex flex-col md:flex-row items-center gap-8 md:gap-12">
        
        <!-- Soft Ambient Background Glows -->
        <div class="absolute -top-16 -right-16 w-48 h-48 bg-molang-rose/15 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-48 h-48 bg-molang-soft/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Profile Avatar -->
        <div class="relative flex-shrink-0 text-center">
          <div class="relative w-36 h-36 sm:w-44 sm:h-44 rounded-full bg-gradient-to-tr from-molang-soft via-molang-accent to-white p-1.5 shadow-md">
            <div class="w-full h-full rounded-full bg-molang-card flex items-center justify-center overflow-hidden border-2 border-molang-soft relative animate-molang-float">
              <img src="07E03E68-3256-4A01-9FB6-72AAA629338A.jpeg" alt="Sofia Shane" class="w-full h-full object-cover">
            </div>
            <!-- Online Availability Badge -->
            <div class="absolute bottom-2 right-2 bg-emerald-400 border-2 border-white w-5 h-5 rounded-full shadow-sm" title="Available for Remote Work"></div>
          </div>

          <div class="mt-3 inline-flex items-center gap-1.5 bg-molang-accent px-3.5 py-1.5 rounded-full text-xs font-bold text-molang-rose border border-molang-soft shadow-sm">
            <i class="fa-solid fa-heart text-[10px]"></i> Open for EA & VA Roles
          </div>
        </div>

        <!-- Main Profile Info -->
        <div class="flex-grow text-center md:text-left space-y-4">
          <div>
            <span class="text-xs uppercase tracking-widest font-extrabold text
